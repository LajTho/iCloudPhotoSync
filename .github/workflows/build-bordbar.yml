name: BordBar iOS Build

on:
  push:
    paths:
      - 'BordBar/**'
      - '.github/workflows/build-bordbar.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Build für den iOS-Simulator
        working-directory: BordBar
        run: |
          xcodebuild build \
            -project BordBar.xcodeproj \
            -scheme BordBar \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
